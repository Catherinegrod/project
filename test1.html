<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Цитаты для эпиграфов</title>
</head>
<body>
  <h1>Цитаты для эпиграфов</h1>
  <button onclick="f1()">И. С. Тургенев</button>
  <div id="a"></div>

  <script>
    function f1() {
      const quotes = [
        "Природа не храм, а мастерская, и человек в ней работник",
        "Важно то, что дважды два четыре, а остальное все пустяки",
        "Порядочный химик в двадцать раз полезнее всякого поэта"
      ];
      let n = new Date();
      let h = n.getSeconds();
      let i=h%3;
      const randomQuote = quotes[i];
document.getElementById("a").innerHTML = "<p>" + randomQuote + "</p>";
      
    }
  </script>
</body>
</html>
